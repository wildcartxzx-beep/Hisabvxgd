<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হিসাব রক্ষণ ও লেজার</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-10">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md sticky top-0 z-50">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-400">হিসাব-নিকাশ খাতা</h1>
            <div>
                <button id="adminToggleBtn" onclick="toggleAdminModal()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg border border-slate-600 transition">
                    🔒 অ্যাডমিন লগইন
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-6">

        <!-- Balance Display Card -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 text-center shadow-lg">
            <p class="text-sm text-slate-400 mb-1">বর্তমান আর্থিক অবস্থা</p>
            <h2 id="displayBalance" class="text-4xl font-extrabold text-emerald-400">৳ ০</h2>
            <p id="balanceStatusText" class="text-xs text-slate-400 mt-2">হিসাব লোড হচ্ছে...</p>
        </div>

        <!-- Admin Control Panel (Hidden by default) -->
        <div id="adminPanel" class="bg-slate-800 border border-emerald-500/30 rounded-2xl p-5 shadow-lg hidden space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="font-semibold text-emerald-400">⚙️ নতুন হিসাব এন্ট্রি করুন</h3>
                <button onclick="logoutAdmin()" class="text-xs text-red-400 hover:underline">লগআউট</button>
            </div>

            <!-- Simple Input Box -->
            <div>
                <label class="block text-xs text-slate-400 mb-1">টাকার পরিমাণ বা এমাউন্ট লিখুন:</label>
                <div class="flex gap-2">
                    <input type="number" id="inputAmount" placeholder="যেমন: ৫০০" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-lg focus:outline-none focus:border-emerald-500">
                    <button onclick="addToList()" class="bg-slate-700 hover:bg-slate-600 px-5 rounded-xl font-medium transition">যোগ</button>
                </div>
            </div>

            <!-- Added Amounts List (Badges) -->
            <div id="badgeContainer" class="flex flex-wrap gap-2 min-h-[40px] bg-slate-900/50 p-3 rounded-xl border border-slate-800">
                <span class="text-xs text-slate-500">যোগ করা এমাউন্টগুলো এখানে দেখাবে...</span>
            </div>

            <!-- Percentage Option -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">পার্সেন্টেজ (%) বাদ দিন:</label>
                    <input type="number" id="inputPercentage" value="0" placeholder="0" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">ছোট নোট (ঐচ্ছিক):</label>
                    যেমন: বাজার খরচ...
                    <input type="text" id="inputDesc" placeholder="বিবরণ" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <!-- Final Net Preview -->
            <div class="bg-slate-900 p-3 rounded-xl flex justify-between items-center text-sm">
                <span class="text-slate-400">হিসাব শেষে নিট এমাউন্ট:</span>
                <span id="previewNet" class="font-bold text-emerald-400 text-lg">৳ ০</span>
            </div>

            <!-- Simple & Clean Action Buttons -->
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="submitTransaction('deposit')" class="bg-emerald-600 hover:bg-emerald-500 font-medium py-3 rounded-xl transition shadow-md">
                    জমা করুন
                </button>
                <button id="dynamicActionBtn" onclick="submitTransaction('withdraw')" class="bg-rose-600 hover:bg-rose-500 font-medium py-3 rounded-xl transition shadow-md">
                    উত্তোলন করুন
                </button>
            </div>
        </div>

        <!-- History Ledger Section -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg space-y-4">
            <h3 class="font-semibold text-slate-300 border-b border-slate-700 pb-2">📜 পূর্বের লেনদেনসমূহ</h3>
            <div id="transactionList" class="space-y-3 max-h-[450px] overflow-y-auto pr-1">
                <p class="text-center text-slate-500 text-sm py-4">তথ্য লোড হচ্ছে...</p>
            </div>
        </div>

    </main>

    <!-- Admin Pin Modal -->
    <div id="pinModal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-xs space-y-4 shadow-2xl">
            <h3 class="font-bold text-center text-slate-200">অ্যাডমিন পিন দিন</h3>
            <input type="password" id="pinInput" placeholder="পিন কোড (যেমন: 1234)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-center tracking-widest text-lg focus:outline-none focus:border-emerald-500">
            <div class="flex gap-2">
                <button onclick="closePinModal()" class="w-1/2 bg-slate-700 hover:bg-slate-600 py-2.5 rounded-xl text-sm">বাতিল</button>
                <button onclick="verifyPin()" class="w-1/2 bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-xl text-sm font-medium">প্রবেশ</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwb7AQNSExxNHOO8dd4OyIqmqycGwKQp4GtKiI-GypH0X3RPupj-C1hGQFPHYLiAqYy/exec";
        
        let currentBalance = 0;
        let amountsArray = [];
        let isAdmin = localStorage.getItem('isAdminLoggedIn') === 'true';

        window.onload = function() {
            fetchData();
            updateAdminUI();
        };

        // Fetch Data from Google Sheets
        function fetchData() {
            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    currentBalance = data.balance;
                    updateBalanceDisplay();
                    renderTransactions(data.transactions);
                })
                .catch(err => {
                    document.getElementById('balanceStatusText').innerText = "ডাটা লোড করতে সমস্যা হয়েছে!";
                });
        }

        // Update Balance UI & Dynamic Button Text Logic
        function updateBalanceDisplay() {
            const balanceElem = document.getElementById('displayBalance');
            const statusElem = document.getElementById('balanceStatusText');
            const dynamicBtn = document.getElementById('dynamicActionBtn');

            balanceElem.innerText = `৳ ${currentBalance.toLocaleString('bn-BD')}`;

            if (currentBalance > 0) {
                statusElem.innerText = "উদ্বৃত্ত / জমা ব্যালেন্স রয়েছে";
                statusElem.className = "text-xs text-emerald-400 mt-2 font-medium";
                dynamicBtn.innerText = "উত্তোলন করুন";
                dynamicBtn.className = "bg-amber-600 hover:bg-amber-500 font-medium py-3 rounded-xl transition shadow-md";
            } else if (currentBalance < 0) {
                statusElem.innerText = `পাওনা রয়েছে (মাইনাস: ৳ ${Math.abs(currentBalance).toLocaleString('bn-BD')})`;
                statusElem.className = "text-xs text-rose-400 mt-2 font-medium";
                dynamicBtn.innerText = "অগ্রিম নিন";
                dynamicBtn.className = "bg-rose-600 hover:bg-rose-500 font-medium py-3 rounded-xl transition shadow-md";
            } else {
                statusElem.innerText = "হিসাব শূন্য (৳ ০)";
                statusElem.className = "text-xs text-slate-400 mt-2 font-medium";
                dynamicBtn.innerText = "উত্তোলন / অগ্রিম";
                dynamicBtn.className = "bg-slate-700 hover:bg-slate-600 font-medium py-3 rounded-xl transition shadow-md";
            }
        }

        // Add input amounts to temporary array
        function addToList() {
            const val = parseFloat(document.getElementById('inputAmount').value);
            if (!isNaN(val) && val > 0) {
                amountsArray.push(val);
                document.getElementById('inputAmount').value = '';
                renderBadges();
                calculatePreview();
            }
        }

        function removeAmount(index) {
            amountsArray.splice(index, 1);
            renderBadges();
            calculatePreview();
        }

        function renderBadges() {
            const container = document.getElementById('badgeContainer');
            if (amountsArray.length === 0) {
                container.innerHTML = `<span class="text-xs text-slate-500">যোগ করা এমাউন্টগুলো এখানে দেখাবে...</span>`;
                return;
            }
            container.innerHTML = amountsArray.map((amt, idx) => `
                <span class="bg-slate-800 border border-slate-700 px-3 py-1 rounded-lg text-sm flex items-center gap-2">
                    ৳ ${amt}
                    <button onclick="removeAmount(${idx})" class="text-rose-400 hover:text-rose-300 font-bold">&times;</button>
                </span>
            `).join('');
        }

        function calculatePreview() {
            const sum = amountsArray.reduce((a, b) => a + b, 0);
            const percentage = parseFloat(document.getElementById('inputPercentage').value) || 0;
            const net = sum - (sum * (percentage / 100));
            document.getElementById('previewNet').innerText = `৳ ${net.toFixed(2)}`;
            return { sum, net };
        }

        document.getElementById('inputPercentage').addEventListener('input', calculatePreview);

        // Submit to Google Sheets
        function submitTransaction(type) {
            if (amountsArray.length === 0) {
                alert("দয়া করে অন্তত একটি এমাউন্ট যোগ করুন!");
                return;
            }

            const { sum, net } = calculatePreview();
            const percentage = parseFloat(document.getElementById('inputPercentage').value) || 0;
            const description = document.getElementById('inputDesc').value;

            const payload = {
                type: type,
                prevBalance: currentBalance,
                inputAmount: sum,
                percentage: percentage,
                netAmount: net,
                description: description
            };

            // Loading state
            const btnText = event.target.innerText;
            event.target.innerText = "সংরক্ষণ হচ্ছে...";
            event.target.disabled = true;

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === "success") {
                    amountsArray = [];
                    document.getElementById('inputPercentage').value = "0";
                    document.getElementById('inputDesc').value = "";
                    renderBadges();
                    calculatePreview();
                    fetchData();
                    alert("সফলভাবে সংরক্ষিত হয়েছে!");
                } else {
                    alert("সমস্যা হয়েছে: " + res.message);
                }
                event.target.innerText = btnText;
                event.target.disabled = false;
            })
            .catch(err => {
                alert("সার্ভার কানেকশনে সমস্যা!");
                event.target.innerText = btnText;
                event.target.disabled = false;
            });
        }

        // Render History Ledger
        function renderTransactions(txs) {
            const listElem = document.getElementById('transactionList');
            if (!txs || txs.length === 0) {
                listElem.innerHTML = `<p class="text-center text-slate-500 text-sm py-4">কোনো লেনদেন পাওয়া যায়নি।</p>`;
                return;
            }

            listElem.innerHTML = txs.map(tx => {
                const isDeposit = tx.type === 'deposit';
                const badgeColor = isDeposit ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20';
                const typeText = isDeposit ? 'জমা' : 'উত্তোলন/অগ্রিম';

                return `
                    <div class="bg-slate-900/60 border border-slate-700/60 rounded-xl p-3.5 space-y-2 text-sm">
                        <div class="flex justify-between items-center">
                            <span class="text-xs px-2.5 py-0.5 rounded-full border ${badgeColor}">${typeText}</span>
                            <span class="text-xs text-slate-400">${tx.timestamp}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs text-slate-300 bg-slate-800/50 p-2 rounded-lg">
                            <div>পূর্বের ব্যালেন্স: <span class="font-semibold">৳ ${tx.prevBalance}</span></div>
                            <div>ইনপুট যোগফল: <span class="font-semibold">৳ ${tx.inputAmount}</span></div>
                            <div>পার্সেন্টেজ: <span class="font-semibold">${tx.percentage}%</span></div>
                            <div>নেট এমাউন্ট: <span class="font-semibold text-emerald-400">৳ ${tx.netAmount}</span></div>
                        </div>
                        ${tx.description ? `<p class="text-xs text-slate-400 italic">নোট: ${tx.description}</p>` : ''}
                    </div>
                `;
            }).join('');
        }

        // Admin Security Management
        function toggleAdminModal() {
            if (isAdmin) {
                if(confirm("আপনি কি অ্যাডমিন মোড থেকে বের হতে চান?")) {
                    logoutAdmin();
                }
            } else {
                document.getElementById('pinModal').classList.remove('hidden');
                document.getElementById('pinInput').value = '';
                document.getElementById('pinInput').focus();
            }
        }

        function closePinModal() {
            document.getElementById('pinModal').classList.add('hidden');
        }

        function verifyPin() {
            const enteredPin = document.getElementById('pinInput').value;
            // ডিফল্ট পিন '1234' রাখা হয়েছে, প্রয়োজনে পরিবর্তন করতে পারেন
            if (enteredPin === "1234") {
                isAdmin = true;
                localStorage.setItem('isAdminLoggedIn', 'true');
                closePinModal();
                updateAdminUI();
                alert("অ্যাডমিন মোড সক্রিয় হয়েছে!");
            } else {
                alert("ভুল পিন কোড!");
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            localStorage.setItem('isAdminLoggedIn', 'false');
            updateAdminUI();
        }

        function updateAdminUI() {
            const panel = document.getElementById('adminPanel');
            const btn = document.getElementById('adminToggleBtn');
            if (isAdmin) {
                panel.classList.remove('hidden');
                btn.innerText = "🔓 অ্যাডমিন মোড (লগআউট)";
                btn.className = "bg-emerald-600 hover:bg-emerald-500 text-xs px-3 py-1.5 rounded-lg text-white font-medium transition";
            } else {
                panel.classList.add('hidden');
                btn.innerText = "🔒 অ্যাডমিন লগইন";
                btn.className = "bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg border border-slate-600 transition";
            }
        }
    </script>
</body>
</html>
